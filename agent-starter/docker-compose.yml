# Local stack: the chat app plus an Ollama container.
# After `docker compose up`, pull a model once:  docker compose exec ollama ollama pull llama3.1
services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
    volumes:
      - ./documents:/app/documents:ro
      - chroma:/app/data/chroma
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama
    volumes:
      - ollama:/root/.ollama

volumes:
  chroma:
  ollama:
